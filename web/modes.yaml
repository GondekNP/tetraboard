# Mode/tetrachord definitions -- what shows up in each of the four
# TetraTrays. Loaded once by modes.load_modes() via web/modes.py.
#
# `intervals` is a tetrachord's semitone steps (cumulative from the
# root, one fret each):
#   Major:    2, 2, 1  (perfect 4th span)
#   Minor:    2, 1, 2  (perfect 4th span)
#   Phrygian: 1, 2, 2  (perfect 4th span)
#   Lydian:   2, 2, 2  (tritone span -- the "greedy" one)
#
# Each mode offers a few fingering `shapes` for that same tetrachord,
# built from "the fundamental axiom": jumping to the next string up
# trades `string_interval` frets (however many semitones that string
# sits above the current one -- 5, a perfect 4th, in standard bass
# tuning) for the same net pitch change. A shape's `jumps` list says
# which note indices (0-based, out of the tetrachord's 4 notes) get
# fretted on the string above instead of the anchor string:
#   straight: jumps: []   -- no jump, all 4 notes on one string
#   right:    jumps: [1]  -- jump right after the root (3 of 4 notes
#                            end up on the upper string)
#   left:     jumps: [2]  -- jump right before the last 2 notes (root
#                            + 2nd note stay on the anchor string)
#
# Verified against a real fretted example (Major, root = A, 5th fret
# low string):
#   straight:  A(5) B(7) C#(9) D(10)      -- all on the anchor string
#   right:     A(5) on anchor; B(2) C#(4) D(5) on the string above
#   left:      A(5) B(7) on anchor; C#(4) D(5) on the string above
# `Shape.resolve_cells()` in modes.py reproduces exactly these frets
# from `intervals` + `jumps` + string_interval=5 -- see its docstring
# for the derivation. string_interval itself is NOT stored here: it
# comes from whatever tuning is actually active (main.py works it out
# from the two lowest strings), so these shapes carry over to a
# non-bass tuning without editing this file.
#
# A shape can also skip generation entirely with an explicit `cells:
# [[col, row], ...]` list -- an escape hatch for one-off shapes (e.g. a
# 3-string-crossing fingering) that don't fit the jump rule above.
#
# NOTE (still open): the whiteboard also shows Lydian ZIG/OPEN
# variants distinct from right/left -- not defined yet, tell me the
# rule and I'll add them.

modes:
  - name: Major
    color: "#22C55E"
    intervals: [2, 2, 1]
    shapes:
      - name: straight
        jumps: []
      - name: right
        jumps: [1]
      - name: left
        jumps: [2]

  - name: Minor
    color: "#3B82F6"
    intervals: [2, 1, 2]
    shapes:
      - name: straight
        jumps: []
      - name: right
        jumps: [1]
      - name: left
        jumps: [2]

  - name: Phrygian
    color: "#EC4899"
    intervals: [1, 2, 2]
    shapes:
      - name: straight
        jumps: []
      - name: right
        jumps: [1]
      - name: left
        jumps: [2]

  - name: Lydian
    color: "#F97316"
    intervals: [2, 2, 2]
    shapes:
      - name: straight
        jumps: []
      - name: right
        jumps: [1]
      - name: left
        jumps: [2]
