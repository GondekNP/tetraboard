<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>tetraboard</title>

        <link rel="stylesheet" href="https://pyscript.net/releases/2023.11.2/core.css">
        <script type="module" src="https://pyscript.net/releases/2023.11.2/core.js"></script>

        <style>
            /* Deliberately NOT scaling/stretching the canvas via CSS.
               Keep it at its native pixel size so pointer coordinates
               always line up 1:1 with what's drawn. If you ever add
               responsive sizing here, re-check click alignment. */
            body { margin: 0; background: #202020; color: #EEEEEE; font-family: sans-serif; }
            #sketch-canvas { display: block; margin: 0 auto; }

            /* Plain-HTML control panel -- see web/controls.py. Sketchingpy
               has no widget/dropdown abstraction of its own (confirmed
               against its source and its own example site -- see
               TUTORIAL.md if that file is still around), so this chrome
               lives here rather than being canvas-drawn. */
            #control-panel {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 16px;
                padding: 12px 16px;
                background: #181818;
                border-bottom: 1px solid #303038;
            }
            #control-panel .control-group {
                display: flex;
                align-items: center;
                gap: 6px;
            }
            #control-panel label { font-size: 14px; color: #AAAAAA; }
            #control-panel select,
            #control-panel button,
            #control-panel input[type="file"]::file-selector-button {
                background: #2A2A2E;
                color: #EEEEEE;
                border: 1px solid #303038;
                border-radius: 4px;
                padding: 4px 8px;
                font-size: 14px;
            }
            #control-panel button:hover,
            #control-panel input[type="file"]::file-selector-button:hover {
                background: #383840;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <py-config>
        {
            "packages": ["sketchingpy==0.3.2"],
            "fetch": [
                {"files": [
                    "./config.py",
                    "./controls.py",
                    "./fret.py",
                    "./open_string.py",
                    "./fretboard.py"
                ]}
            ]
        }
        </py-config>

        <!-- Control panel: plain HTML, wired by web/controls.py. This is
             the "portal" for everything that isn't the sketchingpy canvas
             itself -- string count / tuning / fret count pickers, PNG
             export, and save/load state. controls.py only reads these
             elements and exposes callback registration; it has no idea
             what a Fret/String/Fretboard is. Your canvas code registers
             what these controls should actually do -- see DEVELOPING.md. -->
        <div id="control-panel">
            <div class="control-group">
                <label for="control-string-count">Strings</label>
                <select id="control-string-count">
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6" selected>6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                </select>
            </div>

            <div class="control-group">
                <label for="control-tuning">Tuning</label>
                <select id="control-tuning">
                    <option value="E1,A1,D2,G2">Standard 4 (E A D G)</option>
                    <option value="B0,E1,A1,D2,G2">Standard 5 (B E A D G)</option>
                    <option value="B0,E1,A1,D2,G2,C3" selected>Standard 6 (B E A D G C)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="control-fret-count">Frets</label>
                <select id="control-fret-count">
                    <option value="12">12</option>
                    <option value="16">16</option>
                    <option value="20">20</option>
                    <option value="22">22</option>
                    <option value="24" selected>24</option>
                    <option value="27">27</option>
                    <option value="30">30</option>
                </select>
            </div>

            <div class="control-group">
                <button id="control-export-png" type="button">Export PNG</button>
            </div>

            <div class="control-group">
                <button id="control-save-state" type="button">Save State</button>
                <label for="control-load-state">Load State</label>
                <input type="file" id="control-load-state" accept="application/json">
            </div>
        </div>

        <div id="sketch-load-message">Loading...</div>
        <canvas id="sketch-canvas"></canvas>

        <!-- controls.py binds the panel above once and stays loaded for the
             whole session (like devreload.py) -- it must NOT be part of the
             main.py hot-swap path, since re-running its addEventListener
             calls on every save would stack duplicate listeners the same
             way sketchingpy's own canvas listeners would (see
             devreload.py's docstring for the same issue on the canvas
             side). Loads before devreload.py so `controls` is fully set up
             before main.py gets a chance to register callbacks into it. -->
        <script type="py" src="controls.py"></script>

        <!-- devreload.py loads main.py itself and hot-swaps it on save
             (see web/devreload.py) instead of main.py being the direct
             entry point -- that's what lets edits skip the Pyodide boot. -->
        <script type="py" src="devreload.py"></script>
    </body>
</html>
