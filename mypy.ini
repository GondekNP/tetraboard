[mypy]
; Matches the Python actually running these files: Pyodide as bundled by
; PyScript 2023.11.2 (see web/index.html) is 3.11.3, not this devcontainer's
; 3.12 -- checked directly against the running interpreter, not assumed.
python_version = 3.11
warn_unused_ignores = True

; At runtime every file in web/ is fetched flat into Pyodide's filesystem
; root and imported as a top-level module (e.g. `from config import ...`,
; not `from web.config import ...`) -- there is no "web" package. Tell mypy
; to resolve imports the same way rather than as a nested package.
mypy_path = web
explicit_package_bases = True

; js/pyscript/pyodide only exist inside the PyScript/Pyodide browser runtime
; -- no installable package or stub exists for them on a normal dev machine.
[mypy-js]
ignore_missing_imports = True

[mypy-pyscript]
ignore_missing_imports = True

[mypy-pyscript.*]
ignore_missing_imports = True

[mypy-pyodide.*]
ignore_missing_imports = True

; sketchingpy ships no type stubs / py.typed marker.
[mypy-sketchingpy]
ignore_missing_imports = True
